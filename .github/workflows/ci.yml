name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development dependencies
        run: pip install -e .[dev]

      - name: Test
        run: pytest

      - name: Verify stable CLI version
        run: docflow --version

      - name: Build example artifacts
        run: |
          mkdir -p output
          docflow validate examples/sample.md -c examples/docflow.yaml --report output/validation.json
          docflow export examples/sample.md -o output/sample.docx -c examples/docflow.yaml
          docflow export examples/sample.md -o output/sample.html -c examples/docflow.yaml
          docflow export examples/sample.md -o output/sample.pdf -c examples/docflow.yaml

      - name: Build distribution package
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Validate clean wheel installation
        run: |
          python -m venv /tmp/docflow-wheel-venv
          /tmp/docflow-wheel-venv/bin/python -m pip install --upgrade pip
          /tmp/docflow-wheel-venv/bin/python -m pip install dist/*.whl
          /tmp/docflow-wheel-venv/bin/docflow --version
          /tmp/docflow-wheel-venv/bin/docflow --help
          /tmp/docflow-wheel-venv/bin/docflow validate examples/sample.md -c examples/docflow.yaml
          mkdir -p /tmp/docflow-wheel-output
          /tmp/docflow-wheel-venv/bin/docflow export examples/sample.md -o /tmp/docflow-wheel-output/sample.html -c examples/docflow.yaml

      - name: Upload example artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docflow-v1.0.0-example-artifacts
          path: |
            output/sample.docx
            output/sample.html
            output/sample.pdf
            output/validation.json

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docflow-v1.0.0-distribution
          path: dist/*
