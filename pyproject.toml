[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docflow-portfolio"
version = "0.5.0"
description = "Clean-room Markdown document automation CLI for a public portfolio"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Lucas da Silva Santos" }
]
keywords = ["markdown", "document-automation", "cli", "docx", "html", "pdf"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Documentation",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
  "python-docx>=1.1,<2",
  "PyYAML>=6,<7",
  "reportlab>=4,<5"
]

[project.urls]
Homepage = "https://github.com/LSANTOSSS/docflow"
Repository = "https://github.com/LSANTOSSS/docflow"
Issues = "https://github.com/LSANTOSSS/docflow/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pypdf>=5,<6",
  "build>=1.2,<2",
  "twine>=5,<7"
]

[project.scripts]
docflow = "docflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
