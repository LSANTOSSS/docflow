[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docflow-portfolio"
version = "0.1.0"
description = "Clean-room Markdown document automation CLI for a public portfolio"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Lucas da Silva Santos" }
]
dependencies = [
  "python-docx>=1.1,<2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10"
]

[project.scripts]
docflow = "docflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
